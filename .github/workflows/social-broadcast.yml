name: Autonomous Social Link Syndicator

on:
  schedule:
    # Run every 8 hours at 00:00, 08:00, 16:00 UTC (alternating with organic posts)
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in preview/dry-run mode without publishing'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  syndicate:
    name: Syndicate Publications to Bluesky & Mastodon
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests

      - name: Execute Syndication Engine
        env:
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          MASTODON_INSTANCE_URL: ${{ secrets.MASTODON_INSTANCE_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          COMMUNITY_WEBHOOK_URL: ${{ secrets.COMMUNITY_WEBHOOK_URL }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          fi
          python broadcast_engine.py $FLAGS

      - name: Commit Syndication State
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A state/
          git diff --staged --quiet || (git commit -m "chore(syndication): update syndicated history" && git push)
