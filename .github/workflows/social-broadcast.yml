name: Autonomous Social Broadcast Engine

on:
  schedule:
    # Run every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode without publishing'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  broadcast:
    name: Syndicate New Publications to Social Networks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Unit Tests
        run: |
          python -m unittest discover tests

      - name: Broadcast Publications
        env:
          BSKY_IDENTIFIER: ${{ secrets.BSKY_IDENTIFIER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          COMMUNITY_WEBHOOK_URL: ${{ secrets.COMMUNITY_WEBHOOK_URL }}
        run: |
          FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="--dry-run"
          fi
          python broadcast_engine.py $FLAGS

      - name: Commit State
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A state/
          git diff --staged --quiet || (git commit -m "chore(social): update syndicated history" && git push)
